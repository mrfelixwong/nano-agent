[project]
name = "nano-agent"
version = "0.1.0"
description = "A tiny, readable agent with traces, judge, cost metrics, probes, and offline tools."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["typer>=0.9", "requests>=2.31"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
